name: Daily review email
on:
  schedule:
    - cron: "17 16 * * *"        # every day, 16:17 UTC (about 9am Los Angeles)
  workflow_dispatch:
    inputs:
      send:
        description: "Actually send emails? (false = dry run)"
        default: "false"
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python collector.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          YELP_REVIEW_URL: ${{ vars.YELP_REVIEW_URL }}
          # scheduled runs use the repo variable SEND_EMAILS; manual runs use the input
          SEND_EMAILS: ${{ github.event_name == 'workflow_dispatch' && inputs.send || vars.SEND_EMAILS || 'false' }}
